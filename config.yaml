gps:
  gpsd_host: localhost
  gpsd_port: 2947
  reconnect_delay_s: 5
  poll_timeout_s: 0.5
  fix_timeout_s: 10          # used by fusion.py
  
adsb:
  url: "http://127.0.0.1/tar1090/data/aircraft.json"   # ⚠️ verify exact path
  poll_interval_s: 2
  timeout_s: 3
  backoff_base_s: 2
  backoff_max_s: 60
  stale_after_s: 30          # used by fusion.py

wifi:
  interface: wlan1mon
  sniff_burst_s: 1

bluetooth:
  adapter: null              # null = Bleak default adapter
  scan_restart_s: 30

tiles:
  mode: hybrid            # online | offline | hybrid
  cache_dir: data/tiles
  online_check_url: "https://tile.openstreetmap.org/0/0/0.png"
  seed_radius_km: 25
  tile_server_url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"

airspace:
  geofence_path: data/geofences/uk_zones.geojson
  notam_dir: data/notam
  auto_refresh:
    enabled: true
    interval_min: 60
    backoff_max_min: 240
  proximity_alert:
    enabled: true
    radius_km: 5
    check_interval_sec: 15
  openaip:
    api_key: "e4c323fcf6475153b43adca8a46300ef"            # TODO: fill in if using OpenAIP
    endpoint: "https://api.core.openaip.net/api/airspaces"

disclaimer:
  show_on_start: true
  flag_file: "data/.disclaimer_dismissed"

fusion:
  stale_timeout_sec: 30

remoteid:
  stale_after_s: 20          # used by fusion.py

logging:
  level: INFO
  file: airspace.log
